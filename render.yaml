databases:
  - name: censo-db
    databaseName: censo_px
    user: censo_user
    plan: free

services:
  # Backend FastAPI
  - type: web
    name: censo-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w $WEB_CONCURRENCY -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: censo-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FERNET_KEY
        generateValue: true
      - key: HASH_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_HOURS
        value: 8
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_SSL_MODE
        value: require
      - key: DB_POOL_SIZE
        value: 10
      - key: DB_MAX_OVERFLOW
        value: 20
      - key: DB_POOL_TIMEOUT
        value: 30
      - key: DB_POOL_RECYCLE
        value: 1800
      - key: WEB_CONCURRENCY
        value: 2
      - key: PYTHON_VERSION
        value: 3.11

  # Frontend React
  - type: web
    name: censo-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: censo-backend
          envVarKey: RENDER_EXTERNAL_URL