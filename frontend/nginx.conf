server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Headers de seguridad (SAST-15). HSTS deliberadamente NO se agrega
    # aqui: este nginx solo escucha HTTP plano detras del proxy/CDN externo,
    # que es quien termina TLS. Strict-Transport-Security debe emitirlo ese
    # terminador TLS, no un servidor que no controla la conexion HTTPS real.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
