services:
  app:
      build: .
      container_name: censo_app_container
      ports:
        - "8000:8000"
      volumes:
        - .:/app
      env_file:
        - .env

  frontend:
      build: ./frontend
      container_name: censo_frontend_container
      ports:
        - "5173:5173"
      volumes:
        - ./frontend:/app
        - /app/node_modules
      environment:
        - VITE_API_BASE_URL=http://localhost:8000
      depends_on:
        - app

volumes:
  postgres_data: