services:
  db:
    image: postgres:15
    container_name: censo_db_container
    restart: always
    environment:
      # Toma DB_USER/DB_PASSWORD del .env local (mismas variables que usa la
      # app para conectarse). Sin defaults: si faltan, docker compose falla
      # al arrancar en vez de crear una cuenta con password predecible.
      POSTGRES_USER: ${DB_USER:?Define DB_USER en tu .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en tu .env}
      POSTGRES_DB: ${DB_NAME:-censo_pacientes}
    ports:
      # Solo loopback: evita exponer Postgres a la LAN/Internet. La app se
      # sigue conectando igual (localhost:5432) desde el mismo host.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
      build: .
      container_name: censo_app_container
      ports:
        - "8000:8000"
      volumes:
        - .:/app
      env_file:
        - .env
      depends_on:
        - db

  frontend:
      build: ./frontend
      container_name: censo_frontend_container
      ports:
        - "5173:5173"
      volumes:
        - ./frontend:/app
        - /app/node_modules
      environment:
        - VITE_API_BASE_URL=http://localhost:8000
      depends_on:
        - app

volumes:
  postgres_data: